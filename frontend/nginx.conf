# Serves the built Angular app and forwards /api + /hubs to the api container — the production
# equivalent of proxy.conf.json, so the browser only ever talks to one origin (no CORS needed).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's embedded DNS, re-resolved so a restarted api container (new IP) is still found.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8080;

    # Overwrite (never append) the client IP, so a client can't spoof it to dodge rate limits.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass $api;
    }

    # SignalR: WebSocket upgrade, long-lived connections, no buffering.
    location /hubs/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    # Client-side routes (/lobby, /rooms/:id/play, ...) all serve the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
