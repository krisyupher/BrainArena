<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <span class="form-eyebrow">{{ 'app.title' | transloco }}</span>
    <h1>{{ 'auth.login.title' | transloco }}</h1>

    <label>
      {{ 'auth.fields.email' | transloco }}
      <input type="email" formControlName="email" autocomplete="email" />
    </label>

    <label>
      {{ 'auth.fields.password' | transloco }}
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (errorMessage(); as msg) {
      <app-error-banner [message]="msg" />
    }

    <button type="submit" [disabled]="form.invalid || submitting()">
      {{ 'auth.login.submit' | transloco }}
    </button>

    <p class="switch-link">
      {{ 'auth.login.noAccount' | transloco }}
      <a routerLink="/register">{{ 'auth.login.goToRegister' | transloco }}</a>
    </p>
  </form>
</div>
