services:
  postgres:
    image: postgres:16-alpine
    container_name: brainarena-postgres
    environment:
      POSTGRES_DB: brainarena
      POSTGRES_USER: brainarena
      POSTGRES_PASSWORD: brainarena_dev_password
    ports:
      - "5432:5432"
    volumes:
      - brainarena-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainarena -d brainarena"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brainarena-postgres-data:
